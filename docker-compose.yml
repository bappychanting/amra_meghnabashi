version: "3.8"

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: amra_meghnabasi_php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - amra_meghnabasi_net

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: amra_meghnabasi_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - amra_meghnabasi_storage:/var/www/html/storage
      - amra_meghnabasi_cache:/var/www/html/bootstrap/cache
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - amra_meghnabasi_net

volumes:
  amra_meghnabasi_storage:
  amra_meghnabasi_cache:

networks:
  amra_meghnabasi_net:
