version: "3.8"

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: amra_meghnabasi_php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - amra_meghnabasi_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: amra_meghnabasi_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - amra_meghnabasi_net

networks:
  amra_meghnabasi_net:
